    category: Quality
    url: https://example.com/ci
    cost: Free for public repos
    why: Typecheck and tests run before anything lands.
    hours: 1
    priority: high
    status: done

  - name: Screenshot for the README
    category: Docs
    url: https://example.com/screenshot-tips

# Sample projects for `pnpm sample`. Modeled on the kinds of projects I run
# through the hub; every note, idea, file and application here is made up.
# `pnpm sample` copies this to projects.yaml (gitignored) with {{SAMPLE}}
# replaced by this folder's absolute path, then runs the hub against it.
projects:
  # Job-application automation: finds postings, builds application packets,
  # and fills forms for my review.
  - slug: career-hq
    name: Career HQ
    folders: [{{SAMPLE}}/workspace/career-hq]
    keywords: [career hq, job application, cover letter]

  # Market-data collector and paper-trading system (simulated trades only).
  - slug: market-data-pipeline
    name: Market Data Pipeline
    # Built fresh by `pnpm sample` (gitignored): a short history plus uncommitted changes.
    repos: [{{SAMPLE}}/repos/market-data-pipeline]
    folders: [{{SAMPLE}}/workspace/market-data-pipeline]
    keywords: [market data, paper trading, pipeline]

  # Remote sensing class project: land cover classification and change
  # detection from satellite imagery.
  - slug: land-cover
    name: Land Cover Change Detection
    folders: [{{SAMPLE}}/workspace/land-cover]
    keywords: [land cover, remote sensing, change detection]

  # This dashboard.
  - slug: project-hub
    name: Project Hub
    folders: [{{SAMPLE}}/workspace/project-hub]
    keywords: [project hub, dashboard]
